services:
  db:
    image: postgres:16-alpine
    container_name: ynfight-postgres
    environment:
      POSTGRES_USER: ynfight
      POSTGRES_PASSWORD: ynfight
      POSTGRES_DB: ynfight
    ports:
      - "5432:5432"
    volumes:
      - ynfight_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ynfight -d ynfight"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ynfight-redis
    # 缓存专用：内存上限 + allkeys-lru 淘汰（奇术比对缓存无 TTL，靠 LRU 约束增长）
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  ynfight_pgdata:
