[project]
name = "ynfight"
version = "0.1.0"
description = "AI 异能大乱斗 - LLM 驱动的异能对战平台（FastAPI 后端 + React 前端）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web 框架与服务器
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # 数据库
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # 配置与数据校验
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # 用户认证（直接用 bcrypt，避免 passlib 停维护带来的兼容问题）
    "PyJWT>=2.10",
    "bcrypt>=5.0",
    # LLM 调用
    "httpx>=0.28",
    "openai>=1.50",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
